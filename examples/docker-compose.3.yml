# AUTO-GENERATED by scripts/generate-compose.py — edit via generator, not by hand.
# 3 independent Cloudflare WARP exits as SOCKS5 proxies.
# Ports: 40001..40003  bind=127.0.0.1
services:
  warp-n1:
    image: caomingjun/warp:latest
    container_name: warp-n1
    restart: unless-stopped
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    environment:
      - WARP_SLEEP=2
    ports:
      - "127.0.0.1:40001:1080"
    volumes:
      - ./data-n1:/var/lib/cloudflare-warp
    # healthcheck uses the container's SOCKS listener
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 8 --proxy socks5h://127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -q warp=on || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 45s
